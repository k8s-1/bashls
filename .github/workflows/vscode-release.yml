name: VS Code extension release

concurrency:
  group: vscode-release-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    tags:
      - 'bashls-vscode@*'

defaults:
  run:
    working-directory: editors/vscode

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Compile
        run: bun run compile

      - name: Package extension
        run: bunx --bun vsce package --no-dependencies -o bashls.vsix

      - name: Attach vsix to latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --repo "${GITHUB_REPOSITORY}" --json tagName -q .tagName)
          gh release upload "$tag" bashls.vsix --repo "${GITHUB_REPOSITORY}" --clobber
